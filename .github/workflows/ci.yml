name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit registry
        run: npm run audit:registry

      - name: Test registry install
        run: npm run test:registry

      - name: Test components
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://starforge-docs.com
